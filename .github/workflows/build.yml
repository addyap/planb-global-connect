name: Build and Deploy Website

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🧰 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🛠️ Build website
        run: npm run build

      - name: 🔗 Install Playwright for link validation
        run: npx playwright install chromium

      - name: 🔍 Validate internal links
        continue-on-error: true
        run: |
          # Start preview server in background
          npm run preview &
          SERVER_PID=$!
          
          # Wait for server to be ready
          sleep 5
          
          # Run link checker
          PW_BASE_URL=http://localhost:4173 node scripts/check-links.mjs
          
          # Cleanup
          kill $SERVER_PID 2>/dev/null || true

      - name: 🧹 Clean target folder on Bluehost
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rm -rf /home1/ionctpmy/public_html/*

      - name: 🚀 Upload dist contents via rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

          rsync -avz --delete \
            dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home1/ionctpmy/public_html/
