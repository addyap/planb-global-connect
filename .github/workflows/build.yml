name: Build Website

on:
  push:
    branches:
      - main # or whichever branch you want to trigger the build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Use whatever version you need

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build website
        run: npm run build

      - name: Verify sitemap.xml
        run: |
          test -f dist/sitemap.xml || (echo "::error::sitemap.xml missing in dist/" && exit 1)
          test -s dist/sitemap.xml || (echo "::error::sitemap.xml is empty" && exit 1)
          COUNT=$(grep -c "<loc>" dist/sitemap.xml)
          echo "Sitemap URL count: $COUNT"
          test "$COUNT" -gt 0 || (echo "::error::sitemap.xml has no URLs" && exit 1)

      - name: Sitemap sanity checks
        run: node scripts/validate-sitemap.mjs dist/sitemap.xml

      - name: Clean public folder
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rm -rf /home1/ionctpmy/${{ secrets.TARGET_FOLDER }}/


      - name: Upload dist contents via rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

          rsync -avz --delete dist/ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home1/ionctpmy/${{ secrets.TARGET_FOLDER }}/
