        <h1>Plan B Concept — Project Management &amp; Construction Advisory, Côte d'Azur</h1>
        <p>
          Plan B Concept was founded by Anthony Gratton, drawing on more than 30 years of
          experience in construction and project management across the South of France.
          The business exists to solve a specific problem: international property owners on
          the Côte d'Azur deserve the same quality of project oversight they would expect
          at home, delivered in their own language, by someone who knows how the French
          system actually works.
        </p>
        <h2>Services</h2>
        <ul>
          <li><strong>Owner's Representative</strong> — Acting on your behalf throughout your project, managing architects, contractors and suppliers.</li>
          <li><strong>Villa Renovation Management</strong> — End-to-end coordination of villa renovations on the Côte d'Azur, from scoping to handover.</li>
          <li><strong>New Build Project Management</strong> — Managing new construction projects from ground-breaking to occupation.</li>
          <li><strong>Construction Advisory</strong> — Independent technical advice, feasibility studies, quote analysis and contractor selection.</li>
          <li><strong>Site Monitoring &amp; Quality Control</strong> — Regular site visits with detailed photographic reports.</li>
          <li><strong>Bilingual Client Liaison</strong> — Bridging the gap between English-speaking owners and French trades.</li>
        </ul>
        <h2>Frequently Asked Questions</h2>
        <ul>
          <li>What does an owner's representative actually do?</li>
          <li>Do I still need an architect if I hire Plan B Concept?</li>
          <li>How does this differ from a maître d'œuvre?</li>
          <li>Do you work outside Var and Alpes-Maritimes?</li>
          <li>How are fees structured?</li>
          <li>Can you take on a project that's already underway?</li>
        </ul>
        <h2>Areas served</h2>
        <p><strong>Var (83):</strong> Saint-Tropez · Sainte-Maxime · Saint-Raphaël · Fréjus · Grimaud · Cogolin · Ramatuelle · Gassin</p>
        <p><strong>Alpes-Maritimes (06):</strong> Cannes · Nice · Antibes · Cap d'Antibes · Mougins · Valbonne · Grasse · Monaco · Cap Ferrat · Villefranche-sur-Mer · Beaulieu-sur-Mer · Èze · Menton</p>
